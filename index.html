<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClaudeFlare Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <p class="card__eyebrow">GitHub連携テスト用デモ</p>
      <h1 class="card__title">ClaudeFlare の動作確認</h1>
      <p class="card__lead">
        このページは、GitHub リポジトリと連携した最小の動作確認用です。<br />
        ボタンを押すと、ページが即時に反応します。
      </p>

      <button id="demoButton" class="card__button" type="button">動作確認ボタン</button>
      <p id="message" class="card__message" role="status">まだ押されていません。</p>
      <p id="time" class="card__time">現在時刻: --:--:--</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
